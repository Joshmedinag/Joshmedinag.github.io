<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">AOVGuard workflow illustration</title><desc id="desc">EXR and AOV input flows through automated validation to a report. This is a schematic placeholder, not a screenshot of the tool.</desc>
<defs><radialGradient id="bg"><stop stop-color="#27372b"/><stop offset="1" stop-color="#121a16"/></radialGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#566c50" stroke-opacity=".16"/></pattern></defs>
<rect width="1200" height="760" fill="url(#bg)"/><rect width="1200" height="760" fill="url(#grid)"/>
