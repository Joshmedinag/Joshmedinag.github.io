<rect x="824" y="412" width="246" height="102" rx="5" fill="#17211a" stroke="#526347"/><text x="947" y="453" text-anchor="middle" fill="#bacab2" font-size="13" letter-spacing="2">OUTPUT</text><text x="947" y="483" text-anchor="middle" fill="#e5eddf" font-size="20">Report</text>
